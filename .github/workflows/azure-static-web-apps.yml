name: Deploy web version

on:
  push:
    branches: [ main ]
    paths:
      - 'Connect4.Net/Connect4.Web/**'
      - 'Connect4.Net/Connect4.App/**'
      - 'Connect4.Net/Connect4.Engine/**'
      - 'Connect4.Net/Connect4.Engine.Tests/**'
      - 'Connect4.Net/Images/**'
      - 'Test positions/**'
      - 'docs/brain/**'
      - '.github/workflows/azure-static-web-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools

      # The slow test sets are excluded by default.runsettings.
      - name: Test the engine
        run: dotnet test Connect4.Net/Connect4.Engine.Tests/Connect4.Engine.Tests.csproj -c Release

      - name: Publish (AOT)
        run: dotnet publish Connect4.Net/Connect4.Web/Connect4.Web.csproj -c Release -o publish

      # The app is already built, so the action only uploads the static files.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          skip_app_build: true
